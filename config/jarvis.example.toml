# Jarvis MT settings. Copy to config/jarvis.toml and edit.
# Secrets (API keys) never go here: put them in .env (see .env.example).

# "demo" (default) or "live". LIVE also needs the account to be real; DEMO refuses to
# start against a real account.
mode = "demo"

[server]
bind = "127.0.0.1:8787"
# Serve the built web UI from the API (pnpm -C web build). Comment out for dev.
# static_dir = "web/build"
# HTTPS/WSS (PEM files, unencrypted key). Required, together with [auth] enabled = true, to bind
# anything other than loopback. Rebuild the web UI and restart after changing static_dir content.
# tls_cert = "certs/jarvis.crt"
# tls_key = "certs/jarvis.key"
# Extra browser origins allowed to call the API with the session cookie (CORS). Empty by default:
# the web UI is served by the API itself, and `pnpm -C web dev` goes through the Vite proxy, which
# is same-origin too. Anything listed here can drive the whole API.
# dev_origins = ["http://localhost:5173"]
# Time and size limits of the web edge. These are the defaults; the numbers only matter when the
# server is reachable by people or programs you do not trust (a slow or greedy client cannot tie
# the server up). Every one needs a restart.
# header_read_timeout_secs = 10          # time to send a request's headers; also ends idle keep-alive connections
# request_timeout_secs = 30              # most routes, body upload included (the WebSocket has no limit)
long_request_timeout_secs = 300         # /api/chat, /api/voice/*, /api/confirm/*; keep above your slowest provider's timeout_secs (Claude 3D builds: 240)
# max_connections = 256                  # open connections at once; more are closed at once
# chat_rate_limit_per_minute = 20        # POST /api/chat per session (each can cost several model calls)
# transcribe_rate_limit_per_minute = 20  # POST /api/voice/transcribe per session

[bridge]
# The EA binds here. Must be loopback.
endpoint = "tcp://127.0.0.1:5555"
timeout_ms = 3000
# The shared secret between this server and the EA (security finding BR-1). The EA only answers
# a request signed with it, and the server only believes a signed reply. `pwsh scripts\install-ea.ps1`
# creates the key (32 random bytes as 64 hex characters) in the terminal's file sandbox and prints
# this path. Use a TOML literal string (single quotes) so backslashes stay as they are. The
# environment variable JARVIS_BRIDGE_KEY (the key's hex, see .env.example) overrides this setting.
# The server does not start without a valid key. Never commit it.
key_file = 'C:\Users\<you>\AppData\Roaming\MetaQuotes\Terminal\<terminal id>\MQL5\Files\JarvisMT\bridge.key'

[database]
url = "sqlite://data/jarvis.db"

[symbols]
# Arc MT uses canonical instrument names (XAUUSD, US100, US30, EURUSD ...) everywhere; each
# broker's own names (XAUUSD_, US100_Spot, USTEC, EURUSD.pr ...) are mapped per broker, keyed
# by the MT5 company name. Maps are detected automatically at start-up and whenever the
# account in MT5 switches to another broker; see docs/symbol-mapping.md.
#
# The canonical instruments and their generic aliases (GOLD, NAS100, USTEC ...).
instruments = "config/instruments.toml"
# Curated per-broker maps (checked into the repository; beat the detected ones).
broker_map = "config/broker_symbols.toml"
# Where the detected map, your overrides from Settings and the broker catalog snapshots are
# written (broker_symbols.generated.toml, broker_symbols.user.toml, broker-catalogs/).
data_dir = "data"
# false: do not detect automatically; only the curated and user maps apply (the Settings page
# can still run a detection).
auto_detect = true
# Last resort only: appended to every symbol while the current broker has no map in any layer
# (for example detection is off and the broker is not in broker_map). Normally empty.
suffix = ""
# Symbols shown in the UI watchlist: canonical names.
watchlist = ["XAUUSD", "US100", "US30", "EURUSD", "GBPUSD", "BTCUSD"]

# Spoken/typed name -> canonical instrument. Matching is case-insensitive. Older configs that
# name broker symbols here (for example USTEC) keep working: generic aliases are mapped to
# the canonical name.
[symbols.aliases]
gold = "XAUUSD"
cold = "XAUUSD"     # common speech-to-text mishearing
sona = "XAUUSD"     # Hindi
silver = "XAGUSD"
nasdaq = "US100"
nas = "US100"
dow = "US30"
"dow jones" = "US30"
"s&p" = "US500"
spx = "US500"
euro = "EURUSD"
fiber = "EURUSD"
cable = "GBPUSD"
pound = "GBPUSD"
bitcoin = "BTCUSD"
btc = "BTCUSD"

[llm]
# Provider used when a chat request does not name one.
default = "local"
# Load the local default model in the background at start-up (never delays start-up).
warm_up = true

[[llm.providers]]
name = "local"
kind = "ollama"
model = "qwen3.5:9b"            # fits an 8 GB GPU; measure yours with `jarvis-api preflight`
base_url = "http://127.0.0.1:11434"
timeout_secs = 180              # the first request after a cold start loads the model (~40-100 s)
keep_alive = "30m"              # how long Ollama keeps the model loaded after a request

[[llm.providers]]
name = "claude"
kind = "anthropic"
model = "claude-opus-5-5"       # Assistant mode's brain ([assistant] provider = "claude")
api_key_env = "ANTHROPIC_API_KEY"
timeout_secs = 240              # building a 3D model can take two to three minutes
refusal_fallback = true         # a declined request is re-run on another Claude model (billed at its rate)

[[llm.providers]]
name = "openai"
kind = "openai"
model = "gpt-5"                 # set to the model your key can use
api_key_env = "OPENAI_API_KEY"

# ---- Trading (Sprint 2). Every limit is checked before a preview is shown. ----
[limits]
max_lot = 1.0                 # per new order (closing is never limited by this)
max_positions = 5             # open positions + pending orders after a new order
max_daily_loss = 500.0        # account currency; new orders blocked at -500 today
max_risk_percent = 2.0        # most a risk-sized order ("buy gold risking 1%") may risk, in percent of equity (0.1 to 100)
# Canonical names: they apply on every broker, whatever the broker calls the instrument.
allowed_symbols = ["XAUUSD", "XAGUSD", "US100", "US30", "US500", "EURUSD", "GBPUSD", "BTCUSD"]

# New orders only inside this window (broker server time). Remove to allow any time.
[limits.trading_hours]
days = ["mon", "tue", "wed", "thu", "fri"]
start = "00:05"
end = "23:55"

[trading]
token_ttl_secs = 15           # confirm window
voice_token_cap_secs = 30     # voice: window starts after read-back, never beyond this
deviation_points = 20         # max slippage for market orders
kill_switch_engaged = false   # start with trading disabled

# ---- Login (Sprint 4). Create a user with: cargo run -p jarvis-api -- user add <name>
# The JWT secret comes from env JARVIS_JWT_SECRET (see .env.example).
[auth]
enabled = true
session_hours = 12            # 1 to 168
# The session cookie is Secure whenever the server itself serves TLS. Set this to true when a
# reverse proxy terminates TLS in front of a plain-HTTP loopback port.
# cookie_secure = true

# ---- Voice (Sprint 3). Fetch models with: pwsh scripts/fetch-models.ps1 ----
[voice]
enabled = true
whisper_model = "models/whisper/ggml-base.en.bin"
language = "en"
threads = 4
piper_exe = "models/piper/piper.exe"
piper_voice = "models/piper/en_US-lessac-medium.onnx"
max_seconds = 30
# Who speaks: "piper" (default) or "voicestudio" (a local cloned voice; Piper stays the fallback).
# See docs/local-mode.md before switching.
tts_engine = "piper"
# [voice.voicestudio]
# url = "http://127.0.0.1:3900"      # must be this machine
# engine = "mlx-audio"
# model_id = "mlx-community/csm-1b-8bit"
# keep_warm_minutes = 10
# [voice.voicestudio.profiles]
# jarvis = "Jarvis"
# friday = "Friday"

# ---- Personas. Packs live in this folder as <id>.toml (see personas/jarvis.toml).
# A persona changes name, personality, voice, wake phrase and colours only; all safety
# rules, limits and confirmations are shared. Users pick theirs in Settings.
[personas]
dir = "personas"
default = "jarvis"

# ---- Market views: an intraday view of an instrument (bias, confidence, entry zone, stop and
# two targets, key levels, reasons) computed in code from the broker's own prices, the MT5
# economic calendar and, if you set a provider below, headline news. A view is information
# only: it never places or proposes a trade. "Prepare trade" in the app turns one into the
# usual preview, which goes through every limit and needs your confirmation. Every view is
# stored and later scored against what the price did. Needs the EA at version 0.5.0 or newer.
[market]
enabled = true
horizon_minutes = 240            # how long a view stays valid (15 to 1440)
event_blackout_minutes = 30      # stand aside this close to a high-impact event (0 to 240)
calendar_min_importance = "moderate"   # low | moderate | high
rate_limit_per_minute = 30       # GET /api/market/view and /api/market/news requests per minute and session

# News is optional. With provider = "none" the view simply has no news factor.
# finnhub: https://finnhub.io (free key). alphavantage: https://www.alphavantage.co (free key).
# The key is read from the environment (put it in .env), never from this file.
[market.news]
provider = "none"                # none | finnhub | alphavantage
api_key_env = "FINNHUB_API_KEY"  # the NAME of the variable; ALPHAVANTAGE_API_KEY for alphavantage
cache_minutes = 10

# Advanced: change the scoring model (weights, thresholds, ATR multiples). The keys are those
# of jarvis_market::ViewConfig; leave this out unless you know what you are changing.
# [market.view]
# weight_h4_trend = 25.0

# ---- Notes galaxy: your markdown notes as a 3D map, and answers drawn from them (docs/notes-galaxy.md).
# Read only. Sub-folders become colour groups. Sample notes: examples/notes.
[notes]
enabled = true
dir = "notes"

# ---- Assistant mode: Jarvis the butler on Claude, with your notes, "remember that ..." and 3D models
# (docs/assistant-mode.md). Switch with Trading | Assistant in the top bar. It has no MT5 tools at all.
# Needs ANTHROPIC_API_KEY for the server; without it the mode says so and sends nothing anywhere.
# Costs money: Claude Opus 5.5 is $4 per million input tokens and $20 per million output tokens
# (https://www.anthropic.com/pricing). About $0.01-0.02 a reply and $0.10-0.25 a 3D model.
[assistant]
enabled = true
provider = "claude"             # an [[llm.providers]] name
chat_effort = "low"             # low | medium | high | xhigh | max
build_effort = "medium"         # for building 3D models; "high" is more detailed but slower
monthly_budget_usd = 20.0       # nothing is sent to Claude once this month's cost reaches it
price_input_per_mtok = 4.0      # update these if Anthropic's prices change
price_output_per_mtok = 20.0
price_cache_read_per_mtok = 0.2
price_cache_write_per_mtok = 5.0
models_dir = "data/models3d"    # built models (the newest 50)
spend_file = "data/assistant-spend.json"
max_model_kb = 64
captures_dir = "captures"       # "remember that ..." writes notes into [notes] dir / this folder

# ---- Desk mode: Nimbus Desk, Friday and eight specialists (docs/desk-mode.md, ADR-0023).
# Switch with Trading | Assistant | Desk in the top bar. Trades only through Sentinel, Pilot and the usual
# confirmation. On Claude it costs money: Opus 5.5 is $4 per million input tokens and $20 per million output
# tokens; a desk question is about $0.06-0.12 (estimate). Point provider at a local model to run it for free.
# FINNHUB_API_KEY in .env (free tier) adds insiders, fundamentals and filings.
[desk]
enabled = true
provider = "claude"             # an [[llm.providers]] name; any kind works, only Claude is metered
effort = "medium"               # low | medium | high | xhigh | max (Claude only)
monthly_budget_usd = 20.0       # nothing is sent to Claude once this month's Desk cost reaches it
price_input_per_mtok = 4.0
price_output_per_mtok = 20.0
price_cache_read_per_mtok = 0.2
price_cache_write_per_mtok = 5.0
spend_file = "data/desk-spend.json"
universe = []                   # US stocks Scout scans with the watchlist, e.g. ["NVDA", "AAPL"]
indices = ["US500", "NAS100"]   # Atlas and the market pulse
risk_percent = 0.5              # Sentinel: percent of equity at risk per trade
max_open_positions = 2          # Sentinel: open Desk positions at most
no_new_trades_before_close_minutes = 10
fomc_dates = []                 # extra FOMC decision days, "YYYY-MM-DD" (2026 is built in)
holidays = []                   # extra NYSE holidays (2026 and 2027 are built in)
finnhub_key_env = "FINNHUB_API_KEY"
scout_top = 8
# Architecture page (docs/architecture-page.md, ADR-0025): the council and the free scan.
min_reward_risk = 1.5           # Sentinel: smallest reward to risk for a plan with a target
min_council_score = 0.30        # the council passes at |score| >= this
min_non_neutral = 3             # members that must take a side
scan_every_minutes = 15         # free council scan while the US market is open; 0 = off
master_account = 53107904       # the MT5 account the Desk may trade on (0 = no lock); changeable in the UI
master_broker = "IC Markets"

# ---- Learning review (ADR-0025): Claude explains statistics the code computed and suggests weight and guard
# changes; nothing is applied without you. Paid: Sonnet 5.5 is $2 per million input tokens and $10 per million
# output tokens; a review is about $0.03 (estimate). Runs only when you click "Run review".
[learning]
enabled = true
provider = "claude"             # an [[llm.providers]] name
model = "claude-sonnet-5-5"     # replaces the provider's model for this call; "" keeps it
monthly_budget_usd = 2.0
price_input_per_mtok = 2.0
price_output_per_mtok = 10.0
price_cache_read_per_mtok = 0.2
price_cache_write_per_mtok = 2.5
spend_file = "data/learning-spend.json"
max_tokens = 3000

# ---- Alpaca: US stocks on an Alpaca PAPER account, a second venue next to MT5 (docs/alpaca.md, ADR-0024).
# Keys in .env: ALPACA_TRADING_URL (paper host only), ALPACA_KEY_ID, ALPACA_SECRET_KEY. Without them Alpaca is
# off and says why. Every Alpaca trade goes through the same preview, confirm, kill switch and these limits.
# Free: paper trading and the IEX feed cost nothing.
[alpaca]
enabled = true
mode = "paper"                  # the only accepted value
trading_url_env = "ALPACA_TRADING_URL"
key_id_env = "ALPACA_KEY_ID"
secret_key_env = "ALPACA_SECRET_KEY"
trading_url = "https://paper-api.alpaca.markets"   # used when ALPACA_TRADING_URL is not set
data_url = "https://data.alpaca.markets"
feed = "iex"                    # iex (free) or sip (subscription)
symbols = []                    # US stocks that trade on Alpaca, e.g. ["NVDA", "AAPL"]
include_desk_universe = true    # also [desk] universe
extended_hours = false          # off: no Alpaca order while the US market is closed
max_shares = 100                # per order
max_notional_usd = 10000.0      # order value per order
max_positions = 5
max_daily_loss_usd = 500.0
timeout_secs = 10
